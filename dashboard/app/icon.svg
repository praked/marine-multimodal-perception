<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- ASVProject tab icon: gaff-rigged sailboat on Seeblau -->
  <rect width="32" height="32" rx="7" fill="#00a9e0"/>
  <!-- mainsail (aft of mast) -->
  <path d="M16.8 4.5 L16.8 19 L25.5 19 Q22 12 16.8 4.5 Z" fill="#ffffff"/>
  <!-- jib (forward) -->
  <path d="M14.8 8 L14.8 19 L7.5 19 Q11 13.5 14.8 8 Z" fill="#cceef9"/>
  <!-- hull -->
  <path d="M5.5 21.5 h21 l-3 4 h-15 Z" fill="#0a2a3a"/>
  <!-- bow wave -->
  <path d="M4 27.5 q2 -1.6 4 0 t4 0 t4 0 t4 0 t4 0 t4 0" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
</svg>
