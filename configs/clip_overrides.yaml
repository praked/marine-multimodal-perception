  # resolutions than the intrinsics are calibrated for.
  # ─────────────────────────────────────────────────────────────────
  # Fisheye 640x480 vs canonical 864x648 (both 4:3, K scales linearly).
  # Thermal 640x480 vs Lepton-native 160x120 (4x upscale by PureThermal
  # carrier; K calibrated for 160x120, so undistortion collapses to
  # near-uniform unless we downscale on load).
  Boats/2025-06-23_16-21-07:
    fisheye:
      target_image_size: [864, 648]
      note: "fisheye captured at 640x480; intrinsics calibrated for 864x648"
    thermal:
