# Per-clip metadata overrides applied at iterate_triplet read time.
# Use sparingly: only for one-off capture quirks that aren't fixable at
# the camera level and that the algorithm wouldn't otherwise notice
# (rotation, resolution mismatch with the calibrated intrinsics).
#
# Schema:
#   clips:
#     <scene>/<timestamp>:
#       fisheye:
#         target_image_size: [w, h]   # resize to this on load
#         rotation_deg:      0|90|180|270  # rotate clockwise after resize
#         note: "free text"            # why this override exists
#       thermal:
#         <same fields>
#       time_alignment: aligned|drift|broken   # metadata only
#       alignment_note:  "free text"
#
# Notes on geometric correctness:
#   - target_image_size preserves K's calibration when the original aspect
#     ratio matches the canonical (e.g. fisheye 640x480 -> 864x648, both 4:3;
#     thermal 640x480 -> 160x120, both 4:3).
#   - rotation_deg introduces a small K-matrix inaccuracy because cx/cy
#     are not symmetric (fisheye 444/300, thermal 80.4/62.4). For now we
#     accept that and treat rotated clips as "approximately correct";
#     ideal long-term fix is to recapture the affected clip.
#
# time_alignment (metadata only, not consumed by iterate_triplet):
#   - aligned : |video_frames - radar_timestamps| <= 3, treat as canonical
#   - drift   : small gap, useful for tuning but not for fine bin-agreement
#   - broken  : large gap, exclude from intersection analysis. Symptom of
#               data_server.py independent producer threads, not collect.py.

clips:

  # ─────────────────────────────────────────────────────────────────
  # Boats/2025-07-07_17-11-00: rotated mount + broken time alignment
  # ─────────────────────────────────────────────────────────────────
  # Camera box mounted 90 deg CCW: horizon appears vertical, breaking
  # the RANSAC horizon detector and Sobel-x gradient assumptions.
  # Both cameras share the mount so both need rotation.
  # ALSO: 453 video frames vs 211 radar timestamps: data_server.py
  # independent producer threads, not lockstep. time_alignment: broken.
  Boats/2025-07-07_17-11-00:
    fisheye:
      rotation_deg: 90
      note: "camera mounted 90 deg CCW during this session"
    thermal:
      rotation_deg: 90
      note: "same physical mount; capture.py's baked-in cv2.ROTATE_180
             still applied, so saved thermal is at camera-90-CCW + 180-software
             = 90 deg from upright; rotate 90 CW on load to restore"
    time_alignment: broken
    alignment_note: "453 video frames vs 211 radar timestamps (gap +242)"

  # ─────────────────────────────────────────────────────────────────
