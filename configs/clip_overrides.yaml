  # ─────────────────────────────────────────────────────────────────
  # 2026-07-08 field captures: thermal mounted 180 deg from the fisheye
  # ─────────────────────────────────────────────────────────────────
  # AuthorTwo (2026-07-08): the Lepton in this session's mounting is upside
  # down relative to the fisheye; flip on load so both cameras share the
  # same side up. Applies to the whole 2026-07-08 session: add matching
  # entries when other clips from the day get used.
  # Alignment: 572 video frames vs 590 radar timestamps, but the gap is
  # PURE TAIL loss: the interrupted capture cost the recovered/trimmed
  # videos their last ~6 s (radar runs to 16:40:18.5, group[571] =
  # 16:40:12.5 = last video frame). Index pairing verified: the one 1.7 s
  # capture-loop stall (16:37:30.8) hit video and radar rows together.
  2026-07-08/2026-07-08_16-37-01:
    thermal:
      rotation_deg: 180
      note: "Lepton mounted 180 deg from the fisheye this session; flip to
             same side up"
    time_alignment: aligned
    alignment_note: "head-aligned; 18 radar timestamps past the recovered
                     videos' tail (interrupted capture), harmless under
                     index pairing"
    scene_note: "Clip opens with the boat just off the pontoon: AuthorOne
                 setting it in the water / cleaning cameras (per AuthorTwo,
                 2026-07-09). Early frames legitimately contain a person
                 at close range, handling motion (the large IMU pitch
                 excursions), and possible lens occlusion; the IMU BLE
                 link connects at ~16:37:27. Treat the opening ~30 s as
                 setup, not representative scene content, when labelling
                 or computing metrics."

