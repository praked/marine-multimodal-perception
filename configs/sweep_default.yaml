# Default parameter-sweep grid for scripts/eval/sweep.py.
#
# Convention: each key under `grid:` is a dotted path into detection.yaml.
# Values are lists; the harness takes the Cartesian product.
# `eval_clips:` is the held-out set; one clip per scene is the gate (see
# PLAN.md §I.4.4).

eval_clips:
  # Boats pin swapped 2026-06-11; see sweep_baseline.yaml for why.
  Boats:     "data/Boats/2025-06-23_16-21-07"
  Ducks:     "data/Ducks/2025-07-15_05-36-18"
  OpenWater: "data/OpenWater/2025-06-23_23-53-27"
  Rain:      "data/Rain/2025-07-15_02-59-02"

scene_weights:
  # Used to compute the scene-weighted score described in PLAN.md §I.4.4.
  Boats:     0.4    # recall
  Ducks:     0.3    # recall
  OpenWater: 0.2    # 1 - FP_rate
  Rain:      0.1    # recall

grid:
  fisheye.gradient_threshold: [20, 30, 40, 50]
  fisheye.gaussian_window:    [3, 5, 7]
  fisheye.blob.minArea:       [10, 20, 40]
  thermal.object_thresh:      [60, 80, 100, 120]
  thermal.blob.minArea:       [4, 8, 16]
  horizon.confidence_thresh:  [0.3, 0.5, 0.7]
  mmwave.y_max:               [3.0, 5.0, 9.0]
  fusion.bin_step_deg:        [10]   # held fixed in v1
