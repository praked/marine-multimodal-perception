# Shadow profile: SEGMENTATION-PRIMARY fisheye (2026-09-04).
# = detection.yaml with three deltas for the on-box shadow: horizon.lazy true
# (water edge stands in for the RANSAC horizon when a mask exists),
# fisheye.detector segmentation (the learned mask, not the legacy blob, is
# the fisheye vote — the GBT never used the blob channel), and
# motion.targets on (closing/crossing/CPA for the people-and-boats case).
# Regenerate from detection.yaml when that changes:
#   python -c 'import yaml,copy; b=yaml.safe_load(open("configs/detection.yaml")); ...'
# Offline evaluation keeps detection.yaml (byte-identical corpus features).
horizon:
  ransac_iters: 200
  inlier_thresh: 1.5
  confidence_thresh: 0.5
  fallback_row: 0
  canny_low: 50
  canny_high: 150
  blur_kernel: 5
  lazy: true            # seg detector + mask => RANSAC skipped outright (dock edges read conf ~0.1; measured 2026-09-07)
  lazy_min_conf: 0.5
  imu_seed:
    enabled: false
    max_dev_px: 60
fisheye:
  detector: segmentation
  bearing_model: pinhole
  darkness_thresh: 25.0
  glint_inpaint_low: 240
  glint_inpaint_high: 255
  glint_inpaint_radius: 3
  gaussian_window: 5
  gradient_threshold: 30
  median_blur: 3
  blob:
    minThreshold: 180
    maxThreshold: 255
    blobColor: 255
    minArea: 20
    filterByCircularity: false
    filterByConvexity: false
    filterByInertia: false
thermal:
  bearing_model: linear
  dead_rows:
  - 98
  initial_average: 127.5
  contrast_guard: 50
  object_thresh: 100
  preprocess:
    enabled: false
    median_ksize: 0
    clahe:
      enabled: false
      clip_limit: 2.0
      tile: 8
  quality_guard:
    enabled: false
    min_std: 25.0
    min_dyn_range: 120.0
  background:
    method: running_mean
    mog2:
      history: 90
      var_threshold: 16.0
      learning_rate: -1
  profiles:
    enabled: false
    day_min_elev_deg: 10.0
    night_max_elev_deg: -6.0
    day: {}
    twilight:
      object_thresh: 80
      preprocess:
        enabled: true
        median_ksize: 3
        clahe:
          enabled: true
          clip_limit: 4.0
          tile: 4
    night:
      preprocess:
        enabled: true
        median_ksize: 3
        clahe:
          enabled: true
          clip_limit: 4.0
          tile: 4
      background:
        method: mog2
        mog2:
          history: 45
          var_threshold: 8.0
          learning_rate: -1
  blob:
    minThreshold: 180
    maxThreshold: 255
    blobColor: 255
    minArea: 4
    filterByCircularity: false
    filterByConvexity: false
    filterByInertia: false
mmwave:
  mount_yaw_deg: -6.0
  y_min: 0.5
  y_max: 9.0
  self_clutter:
    enabled: true
    x_min: -1.0
    x_max: 0.25
    zone_y_min: 0.0
    zone_y_max: 1.3
    keep_if_doppler_above: 0.3
  max_objects: 500
  min_objects: 1
range:
  enabled: true
  attitude_priority:
  - water_edge
  - imu
  - horizon
  - level
  imu_gate_deg: 0.0
  use_detected_horizon: true
  horizon_min_confidence: 0.5
  horizon_max_tilt_px: 170
  radar_veto:
    enabled: true
    min_m: 1.0
    max_m: 8.0
    max_bearing_deg: 50.0
  uncertainty_px: 3.0
  max_range_m: 15.0
segmentation:
  enabled: true
  seg_root: data/seg
  use_for_range: true
  use_for_horizon: true
  horizon_min_confidence: 0.4
  contact:
    search_pad_px: 40
    min_columns: 5
    water_below_px: 3
    percentile: 80
  detect:
    min_area: 25
    water_edge_margin_px: 10
    max_components: 100
  fp_filter:
    enabled: false
    min_obstacle_frac: 0.1
fusion:
  bin_min_deg: -52.5
  bin_max_deg: 52.5
  bin_step_deg: 15
  num_sensors: 3
  hit_threshold: 0.33
  vote_range_gate:
    enabled: false
    max_vote_range_m: 30.0
  association:
    enabled: true
    max_px: 32
    thermal_max_px: 12
    min_points: 1
    range_agg: min
    confirm_same_bin: true
    confirm_anchor: radar
    use_radar_range: true
    range_compat_ratio: 0.5
    use_instance_masks: false
    instance_margin_px: 12
    instance_root: data/det_seg
  scorer_smoothing:
    enabled: false
    decay_time_s: 2.0
    gap_reset_s: 5.0
motion:
  gate_m: 0.5
  max_dt_s: 0.5
  ttc_eps_mps: 0.15
  ttc_cap_s: 60.0
  targets:
    enabled: true
    cluster_gate_m: 1.0
    assoc_gate_m: 1.5
    min_hits: 3
    max_age: 5
    ema_alpha: 0.5
    rate_window_s: 2.0
    rate_min_samples: 5
    closing_min_mps: 0.15
    crossing_min_tangential_mps: 0.3
    use_imu_yaw: false
    imu_yaw_sign: 1.0
    max_dt_s: 0.5
    identity:
      enabled: false
      pair_min_hits: 3
      pair_window: 5
      break_misses: 5
      min_overlap_points: 1
      stale_after: 15
      bbox_min_hits: 3
      bbox_max_age: 5
      bbox_pad_px: 8
      offset_alpha: 0.3
    camera_bearing_rate: false
    camera_sustain_max_s: 6.0
    camera_fresh_s: 1.0
heading:
  use_free_space: false
  free_space_max_range_m: 15.0
  free_space_smoothing_alpha: 0.5
  candidate_step_deg: 1.0
  alert_threshold: 0.33
  blocked_threshold: 0.66
  block_sigma_deg: 12.0
  max_swing_deg: 30.0
  weights:
    block: 1.0
    close: 0.3
    ttc: 0.6
    course: 0.2
    nogo: 1.0
  tied_gap_frac: 0.05
  tied_min_separation_deg: 30.0
  range_eps_m: 0.5
  ttc_eps_s: 0.5
  abstain_cost: 0.3
  smoothing_window: 9
  smoothing_min_samples: 3
