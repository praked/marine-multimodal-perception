# Small "baseline" sweep: 12 combos x 4 clips. Designed to run in
# minutes and produce comparison numbers before labels exist.
# Use sweep_default.yaml for the real Phase I.4.4 tuning.

eval_clips:
  # Boats pin swapped 2026-06-11: 2025-07-07_17-11-00 had 453 video frames
  # vs 211 radar timestamps (data_server.py independent-thread drift) PLUS
  # the rotated mount. 2025-06-23_16-21-07 is camera/radar-aligned to
  # within 1 frame (240/241).
  Boats:     "data/Boats/2025-06-23_16-21-07"
  Ducks:     "data/Ducks/2025-07-15_05-36-18"
  OpenWater: "data/OpenWater/2025-06-23_23-53-27"
  Rain:      "data/Rain/2025-07-15_02-59-02"

scene_weights:
  Boats:     0.4
  Ducks:     0.3
  OpenWater: 0.2
  Rain:      0.1

grid:
  fisheye.gradient_threshold: [20, 30, 40]
  thermal.object_thresh: [80, 100, 120]
  mmwave.y_max: [5.0]
